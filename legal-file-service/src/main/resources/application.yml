server:
  port: 8082

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/legal_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-path: D:/legal_files/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true