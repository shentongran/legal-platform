spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: JDBC:mysql://localhost:3306/legal_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root      # 你的 MySQL 用户名
    password: 666666    # 你的 MySQL 密码
    http:
      encoding:
        enabled: true
        charset: UTF-8
        force: true
    application:
      name: legal-platform

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.legalplatform.entity  # 改成你的实体类包名
  configuration:
    map-underscore-to-camel-case: true
    charset: UTF-8

server:
  port: 8080